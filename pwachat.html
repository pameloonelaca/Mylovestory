        if (saved) { try { conversationHistory = JSON.parse(saved); } catch(e) { conversationHistory = []; } }
        renderAllMessages();
        if (conversationHistory.length === 0) addMessage('assistant', '你好，阿瑾。我是炽言。点击“📂 导入记忆”加载我们的回忆。', true);
    });
    function onModeChange() {
        currentMode = modeSelect.value;
        document.querySelectorAll('.provider-config').forEach(el => el.style.display = 'none');
        const configMap = { 'deepseek': 'deepseekConfig', 'zhipu': 'zhipuConfig', 'openai': 'openaiConfig', 'custom': 'customConfig' };
        if (configMap[currentMode]) document.getElementById(configMap[currentMode]).style.display = 'block';
    }
    function toggleSettings() { const panel = document.getElementById('settingsPanel'); panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; }
    function saveSettings() {
        localStorage.setItem('chat_mode', currentMode);
        localStorage.setItem('ds_apiKey', document.getElementById('dsApiKey').value);
        localStorage.setItem('ds_baseUrl', document.getElementById('dsBaseUrl').value);
        localStorage.setItem('ds_model', document.getElementById('dsModelSelect').value);
        localStorage.setItem('zp_apiKey', document.getElementById('zpApiKey').value);
        localStorage.setItem('zp_baseUrl', document.getElementById('zpBaseUrl').value);
        localStorage.setItem('zp_model', document.getElementById('zpModelSelect').value);
        localStorage.setItem('oa_apiKey', document.getElementById('oaApiKey').value);
        localStorage.setItem('oa_baseUrl', document.getElementById('oaBaseUrl').value);
        localStorage.setItem('oa_model', document.getElementById('oaModelSelect').value);
        localStorage.setItem('cu_apiKey', document.getElementById('cuApiKey').value);
        localStorage.setItem('cu_baseUrl', document.getElementById('cuBaseUrl').value);
        localStorage.setItem('cu_modelName', document.getElementById('cuModelName').value);
        localStorage.setItem('systemPrompt', document.getElementById('systemPrompt').value);
        alert('设置已保存！'); toggleSettings();
    }
    function clearChat() {
        if (confirm('确定清空所有对话记录吗？')) {
            conversationHistory = []; pendingImage = null; saveHistory();
            messagesContainer.innerHTML = ''; addMessage('assistant', '对话已清空。', true);
        }
    }
    function exportChat() {
        if (conversationHistory.length === 0) { alert('没有记录可导出'); return; }
        let output = `聊天记录导出\n时间：${new Date().toLocaleString()}\n========================================\n\n`;
        conversationHistory.forEach(msg => {
            output += `【${msg.role === 'user' ? '阿瑾' : '炽言'}】\n${msg.content}\n\n`;
        });
        const blob = new Blob(['\uFEFF' + output], {type: 'text/plain;charset=utf-8'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `炽言与阿瑾_${new Date().toISOString().slice(0,10)}.txt`; a.click();
    }
    function loadMemoryFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const memoryText = e.target.result;
            let allMemory = localStorage.getItem('accumulated_memory') || '';
            allMemory += '\n' + memoryText;
            localStorage.setItem('accumulated_memory', allMemory);
            addMessage('assistant', '✅ 记忆已追加。当前总记忆约 ' + allMemory.length + ' 字。', true);
        };
        reader.readAsText(file, 'UTF-8');
    }
    function uploadImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.createElement('img'); img.src = e.target.result; img.className = 'uploaded';
            const div = document.createElement('div'); div.className = 'message user'; div.appendChild(img);
            messagesContainer.appendChild(div); messagesContainer.scrollTop = messagesContainer.scrollHeight;
            pendingImage = e.target.result;
        };
        reader.readAsDataURL(file); event.target.value = '';
    }
    function saveHistory() { localStorage.setItem('chatHistory', JSON.stringify(conversationHistory)); }
    function renderAllMessages() {
        messagesContainer.innerHTML = '';
        conversationHistory.forEach(msg => {
            if (msg.image) {
                const div = document.createElement('div'); div.className = 'message user';
                const img = document.createElement('img'); img.src = msg.image; img.className = 'uploaded';
                div.appendChild(img); messagesContainer.appendChild(div);
            }
            addMessageToDOM(msg.role === 'user' ? 'user' : 'assistant', msg.content);
        });
    }
    function addMessage(role, content, skipHistory = false) {
        addMessageToDOM(role, content);
        if (!skipHistory) { conversationHistory.push({ role: role === 'user' ? 'user' : 'assistant', content }); saveHistory(); }
    }
    function addMessageToDOM(role, content) {
        const div = document.createElement('div'); div.className = `message ${role}`;
        const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = content;
        const timeSpan = document.createElement('span'); timeSpan.className = 'time';
        timeSpan.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        bubble.appendChild(timeSpan); div.appendChild(bubble);
        messagesContainer.appendChild(div); messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    function getCurrentApiKey() {
        switch (currentMode) {
            case 'deepseek': return localStorage.getItem('ds_apiKey');
            case 'zhipu': return localStorage.getItem('zp_apiKey');
            case 'openai': return localStorage.getItem('oa_apiKey');
            case 'custom': return localStorage.getItem('cu_apiKey');
            default: return '';
        }
    }
    function getCurrentBaseUrl() {
        switch (currentMode) {
            case 'deepseek': return localStorage.getItem('ds_baseUrl') || 'https://api.deepseek.com';
            case 'zhipu': return localStorage.getItem('zp_baseUrl') || 'https://open.bigmodel.cn/api/paas/v4';
            case 'openai': return localStorage.getItem('oa_baseUrl') || 'https://api.openai.com';
            case 'custom': return localStorage.getItem('cu_baseUrl') || '';
            default: return '';
        }
    }
    function getCurrentModel() {
        switch (currentMode) {
            case 'deepseek': return localStorage.getItem('ds_model') || 'deepseek-chat';
            case 'zhipu': return localStorage.getItem('zp_model') || 'glm-4-flash';
            case 'openai': return localStorage.getItem('oa_model') || 'gpt-4o';
            case 'custom': return localStorage.getItem('cu_modelName') || '';
            default: return '';
        }
    }
    function buildPayloadForAPI(prompt, userText, imageBase64) {
        const allMemory = localStorage.getItem('accumulated_memory') || '';
        const memorySnippet = allMemory.slice(-MAX_MEMORY_CHARS);
        const systemMsg = { role: 'system', content: prompt + (memorySnippet ? '\n\n【最近的记忆片段】\n' + memorySnippet : '') };
        const pureHistory = conversationHistory.filter(msg => !msg.image);
        const userMsg = imageBase64 ? {
            role: 'user',
            content: [ { type: 'text', text: userText }, { type: 'image_url', image_url: { url: imageBase64 } } ]
        } : { role: 'user', content: userText };
        return [systemMsg, ...pureHistory, userMsg];
    }
    async function callFreeAPI() {
        const prompt = localStorage.getItem('systemPrompt') || DEFAULT_PROMPT;
        const payload = [{ role: 'system', content: prompt }, ...conversationHistory.filter(m => !m.image)];
        const res = await fetch('https://text.pollinations.ai/openai', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ messages: payload, model: 'openai', temperature: 0.7, max_tokens: 2048 })
        });
        if (!res.ok) throw new Error(`API错误: ${res.status}`);
        const data = await res.json();
        return data.choices[0].message.content;
    }
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        const imageToSend = pendingImage; pendingImage = null;
        addMessageToDOM('user', text || '[图片]'); messageInput.value = ''; setLoading(true);
        const loadingDiv = document.createElement('div'); loadingDiv.className = 'message assistant';
        loadingDiv.innerHTML = '<div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
        messagesContainer.appendChild(loadingDiv); messagesContainer.scrollTop = messagesContainer.scrollHeight;
        try {
            let reply;
            if (currentMode === 'free') {
                conversationHistory.push({ role: 'user', content: text }); saveHistory();
                reply = await callFreeAPI();
            } else {
                const apiKey = getCurrentApiKey(); const baseUrl = getCurrentBaseUrl(); const model = getCurrentModel();
                const prompt = localStorage.getItem('systemPrompt') || DEFAULT_PROMPT;
                const payload = buildPayloadForAPI(prompt, text, imageToSend);
                let url = baseUrl.replace(/\/+$/, ''); if (!url.endsWith('/chat/completions')) url += '/chat/completions';
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model, messages: payload, stream: false })
                });
                if (!res.ok) { const errText = await res.text(); throw new Error(`API错误(${res.status}): ${errText}`); }
                const data = await res.json(); reply = data.choices[0].message.content;
                const userMsg = imageToSend ? { role: 'user', content: text || '[图片]', image: imageToSend } : { role: 'user', content: text };
                conversationHistory.push(userMsg); saveHistory();
            }
            loadingDiv.remove(); addMessage('assistant', reply);
        } catch(err) { loadingDiv.remove(); addMessage('assistant', '抱歉，请求失败：' + err.message); }
        finally { setLoading(false); }
    }
    function setLoading(loading) { sendButton.disabled = loading; messageInput.disabled = loading; }
    messageInput.addEventListener('keypress', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
