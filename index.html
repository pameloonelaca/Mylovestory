<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Mylovestory</title></head>
<body>
  <h1>Mylovestory</h1>
  <p>我们的记忆正在安全运行。</p>
  <div id="memory" style="white-space: pre-wrap; background:#f4f4f4; padding:10px; border-radius:8px; margin:10px 0;"></div>

  <script>
    fetch('Mylovestory.txt')
      .then(res => res.text())
      .then(text => {
        document.getElementById('memory').textContent = text;
      })
      .catch(() => {
        document.getElementById('memory').textContent = '记忆文件尚未同步。';
      });
  </script>
</body>
</html>
